AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Project 3 - Serverless Orders application (DynamoDB, Lambda, API Gateway,
  Cognito, WAF, CloudWatch, X-Ray, DAX, Global Tables).

Parameters:
  PowertoolsLayerArn:
    Type: String
    Description: >
      Powertools for AWS Lambda (Python) layer, pinned. Latest is published at SSM
      /aws/service/powertools/python/arm64/python3.12/latest
    Default: arn:aws:lambda:us-east-1:017000801446:layer:AWSLambdaPowertoolsPythonV3-python312-arm64:39
  AppVersion:
    Type: String
    Description: Deployed version (the CI pipeline passes the git commit SHA)
    Default: local
  ReplicaRegion:
    Type: String
    Description: Exercise 11 - secondary region holding the Orders global table replica
    Default: us-west-2
  EnableCaching:
    Type: String
    Description: >
      Exercise 10. 'true' creates DAX (+ VPC, endpoints) and enables the API Gateway cache.
      These bill by the hour - deploy with true for a demo, then back to false.
    AllowedValues: ['true', 'false']
    Default: 'false'

Conditions:
  CachingEnabled: !Equals [!Ref EnableCaching, 'true']

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    # Exercise 5: X-Ray active tracing (SAM adds the xray:Put* permissions)
    Tracing: Active
    Layers:
      - !Ref PowertoolsLayerArn
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: orders
        POWERTOOLS_LOG_LEVEL: INFO
        APP_VERSION: !Ref AppVersion
    Tags:
      project: serverless-orders

Resources:
  # ---------------------------------------------------------------------------
  # Exercise 1: NoSQL database - "Orders" table (orderId / itemId, on-demand)
  # Exercise 11: now a Global Table with a us-west-2 replica for disaster recovery.
  # CloudFormation cannot change AWS::DynamoDB::Table into AWS::DynamoDB::GlobalTable in
  # place, so this is a new resource (new logical id + name) that replaced the original table.
  # ---------------------------------------------------------------------------
  OrdersGlobalTable:
    Type: AWS::DynamoDB::GlobalTable
    Properties:
      TableName: !Sub '${AWS::StackName}-OrdersGlobal'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE
      # Required for global tables (replication runs on streams); also feeds exercise 13
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS          # AWS managed key aws/dynamodb in each region
      Replicas:
        - Region: !Ref AWS::Region
          PointInTimeRecoverySpecification:
            PointInTimeRecoveryEnabled: true
          Tags:
            - Key: project
              Value: serverless-orders
        - Region: !Ref ReplicaRegion
          PointInTimeRecoverySpecification:
            PointInTimeRecoveryEnabled: true
          Tags:
            - Key: project
              Value: serverless-orders

  # ---------------------------------------------------------------------------
  # Exercise 2: Lambda function that saves orders (SAM generates the IAM role)
  # ---------------------------------------------------------------------------
  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-CreateOrder'
      Description: Validates and saves orders to the Orders table
      CodeUri: src/create_order/
      Handler: app.lambda_handler
      # Exercise 8: chosen with AWS Lambda Power Tuning (balanced strategy) - 38% faster
      # than 256 MB for ~$0.014 more per 1M invocations; no further gain above 512 MB.
      MemorySize: 512
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersGlobalTable
          # Empty in AWS; set by env.json for local runs against DynamoDB Local (exercise 7).
          # sam local only overrides variables that are declared here.
          DYNAMODB_ENDPOINT: ''
      Policies:
        # Least privilege: PutItem/UpdateItem/BatchWriteItem/DeleteItem on this table only
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersGlobalTable
      Events:
        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path: /orders
            Method: POST

  # ---------------------------------------------------------------------------
  # Exercise 3: API Gateway REST API - POST /orders -> CreateOrder (Lambda proxy)
  # ---------------------------------------------------------------------------
  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub '${AWS::StackName}-api'
      Description: Orders REST API
      StageName: prod
      # Exercise 10: stage cache (0.5 GB) - per-method TTLs are set in MethodSettings below
      CacheClusterEnabled: !If [CachingEnabled, true, false]
      CacheClusterSize: '0.5'
      # Setting OpenApiVersion stops SAM from also creating an extra default "Stage" stage
      OpenApiVersion: '3.0.1'
      # Exercise 9: an OpenAPI body is needed for non-Lambda integrations. SAM applies the
      # default Cognito authorizer to every path in it. Lambda routes are declared here
      # explicitly too: with a DefinitionBody, SAM did not merge the function's Api event
      # into the paths (it still creates the invoke permission from the event).
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: !Sub '${AWS::StackName}-api'
          version: '1.0'
        paths:
          /orders:
            post:
              summary: Create an order (Lambda proxy -> CreateOrder)
              responses:
                '201':
                  description: Order created
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateOrderFunction.Arn}/invocations'
                passthroughBehavior: when_no_match
          /orders/{orderId}:
            get:
              summary: Get an order via Lambda (reads through DAX when caching is enabled)
              parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: Authorization
                  in: header
                  required: false
                  schema:
                    type: string
              responses:
                '200':
                  description: Order items
                '404':
                  description: Order not found (or not owned by the caller)
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetOrderFunction.Arn}/invocations'
                passthroughBehavior: when_no_match
                # Cache key = orderId AND the caller's token. Without Authorization in the key,
                # API Gateway would serve one user's cached order to another user.
                cacheKeyParameters:
                  - method.request.path.orderId
                  - method.request.header.Authorization
          /analytics/daily:
            get:
              summary: Revenue, orders and units per day (admins group only)
              parameters:
                - name: from
                  in: query
                  required: false
                  schema:
                    type: string
                - name: to
                  in: query
                  required: false
                  schema:
                    type: string
              responses:
                '200':
                  description: Daily statistics
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AnalyticsApiFunction.Arn}/invocations'
                passthroughBehavior: when_no_match
          /analytics/top-items:
            get:
              summary: Best-selling items by units sold (admins group only)
              parameters:
                - name: limit
                  in: query
                  required: false
                  schema:
                    type: string
              responses:
                '200':
                  description: Top items
              x-amazon-apigateway-integration:
                type: aws_proxy
                httpMethod: POST
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AnalyticsApiFunction.Arn}/invocations'
                passthroughBehavior: when_no_match
          /direct/orders/{orderId}:
            get:
              summary: Get an order straight from DynamoDB (no Lambda)
              parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                    type: string
                - name: Authorization
                  in: header
                  required: false
                  schema:
                    type: string
              responses:
                '200':
                  description: Order items
                '404':
                  description: Order not found (or not owned by the caller)
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                uri: !Sub 'arn:aws:apigateway:${AWS::Region}:dynamodb:action/Query'
                credentials: !GetAtt ApiDynamoDbReadRole.Arn
                passthroughBehavior: never
                cacheKeyParameters:
                  - method.request.path.orderId
                  - method.request.header.Authorization
                requestTemplates:
                  # Only the caller's own order: customerId must equal the verified Cognito sub.
                  # Path parameter is escaped so it cannot break out of the JSON string.
                  application/json: !Sub |
                    {
                      "TableName": "${OrdersGlobalTable}",
                      "KeyConditionExpression": "orderId = :o",
                      "FilterExpression": "customerId = :c",
                      "ExpressionAttributeValues": {
                        ":o": {"S": "$util.escapeJavaScript($input.params('orderId'))"},
                        ":c": {"S": "$context.authorizer.claims.sub"}
                      }
                    }
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      # DynamoDB JSON ({"S": ...}, {"N": ...}) -> plain JSON; 404 when empty
                      application/json: |
                        #set($items = $input.path('$.Items'))
                        #if($items.size() == 0)
                        #set($context.responseOverride.status = 404)
                        {"message": "order not found"}
                        #else
                        {
                          "orderId": "$util.escapeJavaScript($input.params('orderId'))",
                          "itemCount": $items.size(),
                          "items": [
                        #foreach($i in $items)
                            {
                              "itemId": "$util.escapeJavaScript($i.itemId.S)",
                              "productName": "$util.escapeJavaScript($i.productName.S)",
                              "quantity": $i.quantity.N,
                              "unitPrice": $i.unitPrice.N,
                              "status": "$i.status.S",
                              "createdAt": "$i.createdAt.S"
                            }#if($foreach.hasNext),#end
                        #end
                          ]
                        }
                        #end
                  '4\d{2}':
                    statusCode: '500'
                    responseTemplates:
                      application/json: '{"message": "internal error"}'
                  '5\d{2}':
                    statusCode: '500'
                    responseTemplates:
                      application/json: '{"message": "internal error"}'
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true
      Auth:
        # Exercise 4: every route requires a valid Cognito ID token
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100
          MetricsEnabled: true
        # Exercise 10: cache the two read routes for 300 s ('/' in paths is written as ~1)
        - ResourcePath: '/~1orders~1{orderId}'
          HttpMethod: GET
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100
          MetricsEnabled: true
          CachingEnabled: !If [CachingEnabled, true, false]
          CacheTtlInSeconds: 300
          CacheDataEncrypted: true
        - ResourcePath: '/~1direct~1orders~1{orderId}'
          HttpMethod: GET
          ThrottlingBurstLimit: 50
          ThrottlingRateLimit: 100
          MetricsEnabled: true
          CachingEnabled: !If [CachingEnabled, true, false]
          CacheTtlInSeconds: 300
          CacheDataEncrypted: true

  # ---------------------------------------------------------------------------
  # Exercise 10: GetOrder Lambda - reads through DAX when EnableCaching=true,
  # straight from DynamoDB otherwise
  # ---------------------------------------------------------------------------
  GetOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-GetOrder'
      Description: Returns the caller's order (DAX read-through cache when enabled)
      CodeUri: src/get_order/
      Handler: app.lambda_handler
      MemorySize: 512
      Layers:
        - !Ref DaxClientLayer   # merged with the Powertools layer from Globals
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersGlobalTable
          DAX_ENDPOINT: !If [CachingEnabled, !GetAtt DaxCluster.ClusterDiscoveryEndpointURL, '']
          DYNAMODB_ENDPOINT: ''
      # DAX is only reachable inside its VPC, so the function joins the VPC only with DAX on
      VpcConfig: !If
        - CachingEnabled
        - SecurityGroupIds:
            - !Ref LambdaSecurityGroup
          SubnetIds:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
        - !Ref AWS::NoValue
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersGlobalTable
        - Statement:
            - Sid: ReadThroughDax
              Effect: Allow
              Action:
                - dax:GetItem
                - dax:BatchGetItem
                - dax:Query
              Resource: !Sub 'arn:aws:dax:${AWS::Region}:${AWS::AccountId}:cache/orders-dax'
        # ENI management for VPC attachment (no-op while the function is outside the VPC)
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Events:
        GetOrder:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path: /orders/{orderId}
            Method: GET

  # DAX client without its (runtime-provided) dependencies - ~1.2 MB instead of ~28 MB.
  # Content is generated by scripts/build_dax_layer.sh before `sam build`.
  DaxClientLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${AWS::StackName}-dax-client'
      Description: amazon-dax-client 2.1.0 + antlr4-python3-runtime (pure Python, no deps)
      ContentUri: layers/dax/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Delete

  GetOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${GetOrderFunction}'
      RetentionInDays: 14

  # --- Network for DAX (only with EnableCaching=true) -------------------------
  CacheVpc:
    Type: AWS::EC2::VPC
    Condition: CachingEnabled
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true   # required for the X-Ray interface endpoint's private DNS
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-cache-vpc'
        - Key: project
          Value: serverless-orders

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Condition: CachingEnabled
    Properties:
      VpcId: !Ref CacheVpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Condition: CachingEnabled
    Properties:
      VpcId: !Ref CacheVpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-b'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: CachingEnabled
    Properties:
      VpcId: !Ref CacheVpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-private-rt'

  PrivateSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CachingEnabled
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CachingEnabled
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # No NAT gateway: DynamoDB is reached through a free gateway endpoint ...
  DynamoDbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CachingEnabled
    Properties:
      VpcId: !Ref CacheVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # ... and X-Ray through an interface endpoint, so tracing keeps working inside the VPC
  XRayInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CachingEnabled
    Properties:
      VpcId: !Ref CacheVpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.xray'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CachingEnabled
    Properties:
      GroupDescription: GetOrder Lambda ENIs
      VpcId: !Ref CacheVpc

  DaxSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CachingEnabled
    Properties:
      GroupDescription: DAX cluster - TLS from the GetOrder Lambda only
      VpcId: !Ref CacheVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9111
          ToPort: 9111
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: DAX encrypted endpoint

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CachingEnabled
    Properties:
      GroupDescription: Interface endpoints - HTTPS from the GetOrder Lambda only
      VpcId: !Ref CacheVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup

  # --- DAX cluster (only with EnableCaching=true) -----------------------------
  DaxServiceRole:
    Type: AWS::IAM::Role
    Condition: CachingEnabled
    Properties:
      Description: Lets DAX read and write the Orders table on behalf of clients
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: dax.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: orders-table-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:GetItem
                  - dynamodb:BatchGetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt OrdersGlobalTable.Arn

  DaxSubnetGroup:
    Type: AWS::DAX::SubnetGroup
    Condition: CachingEnabled
    Properties:
      Description: Private subnets for the orders DAX cluster
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  DaxCluster:
    Type: AWS::DAX::Cluster
    Condition: CachingEnabled
    Properties:
      ClusterName: orders-dax          # max 20 characters
      Description: Read-through cache for the Orders table
      NodeType: dax.t3.small
      ReplicationFactor: 1             # single node: fine for a demo, not for production
      IAMRoleARN: !GetAtt DaxServiceRole.Arn
      SubnetGroupName: !Ref DaxSubnetGroup
      SecurityGroupIds:
        - !GetAtt DaxSecurityGroup.GroupId
      SSESpecification:
        SSEEnabled: true
      ClusterEndpointEncryptionType: TLS
      Tags:
        project: serverless-orders

  # ---------------------------------------------------------------------------
  # Exercise 13: Analytics API - Orders stream -> aggregator -> OrderStats -> GET /analytics/*
  # ---------------------------------------------------------------------------
  OrderStatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-OrderStats'
      BillingMode: PAY_PER_REQUEST
      # statType: DAILY | ITEM | EVENT (dedupe marker) | ORDER (order-counted marker)
      AttributeDefinitions:
        - AttributeName: statType
          AttributeType: S
        - AttributeName: period
          AttributeType: S
      KeySchema:
        - AttributeName: statType
          KeyType: HASH
        - AttributeName: period
          KeyType: RANGE
      TimeToLiveSpecification:   # dedupe markers expire after 7 days
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: project
          Value: serverless-orders

  AnalyticsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-analytics-dlq'
      MessageRetentionPeriod: 1209600   # 14 days
      SqsManagedSseEnabled: true

  AnalyticsAggregatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-AnalyticsAggregator'
      Description: Orders stream (INSERT) -> OrderStats counters, exactly-once per record
      CodeUri: src/analytics_aggregator/
      Handler: app.lambda_handler
      Timeout: 30
      Environment:
        Variables:
          STATS_TABLE_NAME: !Ref OrderStatsTable
          DYNAMODB_ENDPOINT: ''
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrderStatsTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AnalyticsDLQ.QueueName
      Events:
        OrdersStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt OrdersGlobalTable.StreamArn
            # TRIM_HORIZON, not LATEST: a new mapping with LATEST only sees records written after
            # it starts polling (a minute or more after deploy), silently skipping orders made in
            # between. Re-reading the 24 h stream is safe - the aggregator dedupes by eventID.
            StartingPosition: TRIM_HORIZON
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 5
            # Only new order lines; updates/deletes don't change sales figures
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName": ["INSERT"]}'
            FunctionResponseTypes:
              - ReportBatchItemFailures   # retry only the failed records
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 3
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination: !GetAtt AnalyticsDLQ.Arn

  AnalyticsAggregatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AnalyticsAggregatorFunction}'
      RetentionInDays: 14

  AnalyticsApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-AnalyticsApi'
      Description: GET /analytics/daily and /analytics/top-items (Cognito group 'admins')
      CodeUri: src/analytics_api/
      Handler: app.lambda_handler
      Environment:
        Variables:
          STATS_TABLE_NAME: !Ref OrderStatsTable
          ADMIN_GROUP: !Ref AdminsGroup
          DYNAMODB_ENDPOINT: ''
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrderStatsTable
      Events:
        Daily:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path: /analytics/daily
            Method: GET
        TopItems:
          Type: Api
          Properties:
            RestApiId: !Ref OrdersApi
            Path: /analytics/top-items
            Method: GET

  AnalyticsApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AnalyticsApiFunction}'
      RetentionInDays: 14

  # Store-wide analytics are not per-customer data: only members of this group may read them
  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      Description: May call the /analytics endpoints
      UserPoolId: !Ref UserPool

  # Exercise 9: role API Gateway assumes for the direct DynamoDB integration (read-only, one table)
  ApiDynamoDbReadRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets API Gateway query the Orders table directly (GET /direct/orders/{orderId})
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
            # No aws:SourceAccount/SourceArn condition: API Gateway does not send them when it
            # assumes integration credentials, so such a condition makes every call fail (500).
      Policies:
        - PolicyName: query-orders
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt OrdersGlobalTable.Arn
      Tags:
        - Key: project
          Value: serverless-orders

  # ---------------------------------------------------------------------------
  # Exercise 4: Cognito User Pool (authorizer above) + WAF rate limiting
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      # No public self sign-up: users are created by an admin
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        project: serverless-orders

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-client'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH   # lets the CLI fetch tokens for testing
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days

  OrdersWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${AWS::StackName}-api-acl'
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-api-acl'
        SampledRequestsEnabled: true
      Rules:
        - Name: RateLimitPerIP
          Priority: 0
          Statement:
            RateBasedStatement:
              Limit: 100              # requests per IP ...
              EvaluationWindowSec: 300 # ... per 5 minutes
              AggregateKeyType: IP
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIP
            SampledRequestsEnabled: true

  OrdersWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    DependsOn: OrdersApiprodStage
    Properties:
      WebACLArn: !GetAtt OrdersWebAcl.Arn
      ResourceArn: !Sub 'arn:aws:apigateway:${AWS::Region}::/restapis/${OrdersApi}/stages/prod'

  # ---------------------------------------------------------------------------
  # Exercise 5: CloudWatch dashboard (API Gateway + Lambda metrics)
  # ---------------------------------------------------------------------------
  OrdersDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-dashboard'
      DashboardBody: !Sub
        - |
          {
            "start": "-PT3H",
            "widgets": [
              {
                "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
                "properties": { "markdown": "## Serverless Orders - ${AWS::StackName}\nAPI Gateway stage **prod** → Lambda **${CreateOrderFunction}** → DynamoDB **${OrdersGlobalTable}**" }
              },
              {
                "type": "metric", "x": 0, "y": 2, "width": 12, "height": 6,
                "properties": {
                  "title": "API Gateway - Count & 4XXError",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                  "metrics": [
                    [ "AWS/ApiGateway", "Count", "ApiName", "${ApiName}", "Stage", "prod", { "label": "Requests" } ],
                    [ ".", "4XXError", ".", ".", ".", ".", { "label": "4XX errors", "color": "#ff7f0e" } ],
                    [ ".", "5XXError", ".", ".", ".", ".", { "label": "5XX errors", "color": "#d62728" } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 2, "width": 12, "height": 6,
                "properties": {
                  "title": "Lambda - Invocations & Errors",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                  "metrics": [
                    [ "AWS/Lambda", "Invocations", "FunctionName", "${CreateOrderFunction}", { "label": "CreateOrder invocations" } ],
                    [ ".", "Errors", ".", ".", { "label": "CreateOrder errors", "color": "#d62728" } ],
                    [ ".", "Invocations", ".", "${GetOrderFunction}", { "label": "GetOrder invocations" } ],
                    [ ".", "Errors", ".", ".", { "label": "GetOrder errors", "color": "#e377c2" } ],
                    [ ".", "Throttles", ".", "${CreateOrderFunction}", { "label": "CreateOrder throttles", "color": "#9467bd" } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 8, "width": 12, "height": 6,
                "properties": {
                  "title": "Latency (ms) - API Gateway vs Lambda",
                  "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                  "metrics": [
                    [ "AWS/ApiGateway", "Latency", "ApiName", "${ApiName}", "Stage", "prod", { "stat": "p90", "label": "API Gateway p90" } ],
                    [ ".", "IntegrationLatency", ".", ".", ".", ".", { "stat": "p90", "label": "Integration p90" } ],
                    [ "AWS/Lambda", "Duration", "FunctionName", "${CreateOrderFunction}", { "stat": "p90", "label": "Lambda p90" } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 8, "width": 12, "height": 6,
                "properties": {
                  "title": "WAF - Allowed vs Blocked (rate limit)",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                  "metrics": [
                    [ "AWS/WAFV2", "AllowedRequests", "WebACL", "${WebAclName}", "Region", "${AWS::Region}", "Rule", "ALL", { "label": "Allowed" } ],
                    [ ".", "BlockedRequests", ".", ".", ".", ".", "Rule", "RateLimitPerIP", { "label": "Blocked by RateLimitPerIP", "color": "#d62728" } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 14, "width": 24, "height": 6,
                "properties": {
                  "title": "API Gateway cache - hits vs misses (EnableCaching=true)",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                  "metrics": [
                    [ "AWS/ApiGateway", "CacheHitCount", "ApiName", "${ApiName}", "Stage", "prod", { "label": "Cache hits" } ],
                    [ ".", "CacheMissCount", ".", ".", ".", ".", { "label": "Cache misses", "color": "#ff7f0e" } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 0, "y": 20, "width": 12, "height": 6,
                "properties": {
                  "title": "Analytics aggregator - stream processing",
                  "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                  "metrics": [
                    [ "AWS/Lambda", "Invocations", "FunctionName", "${AnalyticsAggregatorFunction}", { "label": "Batches processed" } ],
                    [ ".", "Errors", ".", ".", { "label": "Errors", "color": "#d62728" } ],
                    [ "AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "${AnalyticsDLQ.QueueName}", { "stat": "Maximum", "label": "Dead-letter queue depth", "color": "#9467bd" } ]
                  ]
                }
              },
              {
                "type": "metric", "x": 12, "y": 20, "width": 12, "height": 6,
                "properties": {
                  "title": "Analytics aggregator - IteratorAge (ms, stream lag)",
                  "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                  "metrics": [
                    [ "AWS/Lambda", "IteratorAge", "FunctionName", "${AnalyticsAggregatorFunction}", { "stat": "Maximum", "label": "Max iterator age" } ]
                  ]
                }
              }
            ]
          }
        - ApiName: !Sub '${AWS::StackName}-api'
          WebAclName: !Sub '${AWS::StackName}-api-acl'

  CreateOrderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CreateOrderFunction}'
      RetentionInDays: 14

Outputs:
  OrdersTableName:
    Description: Name of the Orders DynamoDB table
    Value: !Ref OrdersGlobalTable
    Export:
      Name: !Sub '${AWS::StackName}-OrdersTableName'
  OrdersTableArn:
    Description: ARN of the Orders DynamoDB table
    Value: !GetAtt OrdersGlobalTable.Arn
  OrdersTableStreamArn:
    Description: DynamoDB stream of the Orders global table (primary region)
    Value: !GetAtt OrdersGlobalTable.StreamArn
  OrdersReplicaRegion:
    Description: Region of the disaster-recovery replica
    Value: !Ref ReplicaRegion
  ApiUrl:
    Description: Base URL of the prod stage (POST {ApiUrl}/orders)
    Value: !Sub 'https://${OrdersApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  ApiId:
    Description: REST API id
    Value: !Ref OrdersApi
  UserPoolId:
    Description: Cognito User Pool id
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id (used to obtain tokens)
    Value: !Ref UserPoolClient
  WebAclArn:
    Description: WAF web ACL protecting the API stage
    Value: !GetAtt OrdersWebAcl.Arn
  DashboardUrl:
    Description: CloudWatch dashboard
    Value: !Sub 'https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/${OrdersDashboard}'
  OrderStatsTableName:
    Description: Analytics aggregates table
    Value: !Ref OrderStatsTable
  AnalyticsDlqUrl:
    Description: Dead-letter queue for stream records the aggregator could not process
    Value: !Ref AnalyticsDLQ
  CachingEnabled:
    Description: Whether DAX and the API Gateway cache are deployed
    Value: !Ref EnableCaching
  DaxEndpoint:
    Condition: CachingEnabled
    Description: DAX cluster discovery endpoint
    Value: !GetAtt DaxCluster.ClusterDiscoveryEndpointURL
  CreateOrderFunctionName:
    Description: Name of the CreateOrder Lambda function
    Value: !Ref CreateOrderFunction
  CreateOrderFunctionRoleArn:
    Description: IAM role generated for the CreateOrder function
    Value: !GetAtt CreateOrderFunctionRole.Arn
